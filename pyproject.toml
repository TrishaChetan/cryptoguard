[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoguard"
version = "1.0.0"
description = "Explainable, self-responding cryptojacking detection for cloud servers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "shap>=0.44",
  "psutil>=5.9", "PyYAML>=6.0", "joblib>=1.3",
]

[project.optional-dependencies]
aws = ["boto3>=1.28"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
cryptoguard = "cryptoguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
